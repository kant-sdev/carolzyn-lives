[build]
  command = "bun run build"
  publish = "dist/client"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/server/**"]

[[redirects]]
  from = "/api/twitch/stream"
  to = "/.netlify/functions/twitch-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/devotional/verse"
  to = "/.netlify/functions/devotional-verse"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
